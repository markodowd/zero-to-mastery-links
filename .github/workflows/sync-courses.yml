name: Sync ZTM Courses

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 6am UTC
  workflow_dispatch: # Also triggerable manually from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Sync courses (only runs if tests pass)
        run: node scripts/sync-courses.js

      - name: Commit updated CSV if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add academy.csv
          if git diff --staged --quiet; then
            echo "No changes to academy.csv — nothing to commit."
          else
            git commit -m "chore: sync ZTM course list [skip ci]"
            git push
          fi
